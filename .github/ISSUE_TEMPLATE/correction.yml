name: 상품 정보 정정·삭제 요청
description: 잘못된 상품 정보의 정정이나 삭제를 요청합니다.
title: "[정정 요청] "
labels: ["data-correction"]
body:
  - type: input
    id: product
    attributes:
      label: 상품명
      placeholder: 브랜드와 상품명을 입력해 주세요.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 오늘신상 페이지 또는 공식 출처 주소
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: request
    attributes:
      label: 요청 유형
      options:
        - 정보 정정
        - 판매 종료 반영
        - 상품 삭제
        - 기타
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 요청 내용
      description: 민감정보나 개인정보는 입력하지 마세요.
    validations:
      required: true
  - type: checkboxes
    id: source
    attributes:
      label: 확인
      options:
        - label: 가능한 경우 확인할 수 있는 공식 출처를 함께 제공했습니다.
