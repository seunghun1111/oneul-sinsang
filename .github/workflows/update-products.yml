name: Update products

on:
  schedule:
    # 매일 06:30 Asia/Seoul (UTC 21:30, 전날)
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-products
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check CU official NEW products
        run: npm run update:cu
      - name: Check other convenience-store official NEW products
        run: npm run update:convenience
      - name: Check burger, pizza and chicken official NEW products
        run: npm run update:foodservice
      - name: Check ice cream official NEW products
        run: npm run update:icecream
      - run: npm run update:coffee
      - name: Enrich exact-match official coffee product images
        run: npm run update:coffee-images
      - name: Check additional chicken and ice cream brands
        run: npm run update:brands
      - run: npm run update:products
      - name: Recheck official announcements missing from recent lists
        run: npm run review:press-recheck
      - name: Summarize collection operations
        if: always()
        run: npm run report:collection
      - name: Refresh source policy guidance (robots only)
        run: npm run check:policies
      - name: Evaluate automatic review evidence
        run: npm run review:auto
      - name: Validate catalog integrity without changing data
        run: npm run check:quality -- --check
      - run: npm test
      - run: npm run lint
      - run: env GITHUB_ACTIONS=true npm run build
      - name: Reject stale collection results before publishing
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::main changed during collection. Existing data is preserved; rerun on the latest main."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
      - name: Notify only new review exceptions (one daily digest)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_FAILED: ${{ job.status == 'failure' }}
        run: npm run review:notify -- --send
      - name: Commit updated product data
        run: |
          if git diff --quiet -- src/data/products.json src/data/coffee-products-auto.json src/data/coffee-image-status.json src/data/brand-collection-status.json src/data/coffee-collection-status.json src/data/convenience-collection-status.json src/data/foodservice-collection-status.json src/data/press-collection-status.json src/data/cu-collection-status.json src/data/icecream-collection-status.json src/data/auto-review.json src/data/review-queue.json src/data/review-notification-state.json src/data/review-decisions.json src/data/new-history.json src/data/collection-health.json src/data/collection-policy-status.json; then
            echo "No product changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json src/data/coffee-products-auto.json src/data/coffee-image-status.json src/data/brand-collection-status.json src/data/coffee-collection-status.json src/data/convenience-collection-status.json src/data/foodservice-collection-status.json src/data/press-collection-status.json src/data/cu-collection-status.json src/data/icecream-collection-status.json src/data/auto-review.json src/data/review-queue.json src/data/review-notification-state.json src/data/review-decisions.json src/data/new-history.json src/data/collection-health.json src/data/collection-policy-status.json
          git commit -m "chore: update official product data"
          git push
      - name: Preserve collection diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: collection-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            src/data/*-collection-status.json
            src/data/collection-health.json
            src/data/collection-policy-status.json
            src/data/coffee-image-status.json
      - name: Notify failures occurring after the regular digest
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_FAILED: "true"
        run: npm run review:notify -- --send

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: update
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
