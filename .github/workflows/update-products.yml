name: Update products

on:
  schedule:
    # 매일 06:30 Asia/Seoul (UTC 21:30, 전날)
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-products
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check CU official NEW products
        run: npm run update:cu
      - name: Check other convenience-store official NEW products
        run: npm run update:convenience
      - name: Check burger, pizza and chicken official NEW products
        run: npm run update:foodservice
      - name: Check ice cream official NEW products
        run: npm run update:icecream
      - run: npm run update:coffee
      - name: Check additional chicken and ice cream brands
        run: npm run update:brands
      - run: npm run update:products
      - name: Recheck official announcements missing from recent lists
        run: npm run review:press-recheck
      - name: Summarize collection operations
        if: always()
        run: npm run report:collection
      - name: Evaluate automatic review evidence
        run: npm run review:auto
      - run: npm test
      - run: npm run lint
      - run: env GITHUB_ACTIONS=true npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Notify only new review exceptions (one daily digest)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_FAILED: ${{ job.status == 'failure' }}
        run: npm run review:notify -- --send
      - name: Commit updated product data
        run: |
          if git diff --quiet -- src/data/products.json src/data/coffee-products-auto.json src/data/brand-collection-status.json src/data/coffee-collection-status.json src/data/convenience-collection-status.json src/data/foodservice-collection-status.json src/data/press-collection-status.json src/data/cu-collection-status.json src/data/icecream-collection-status.json src/data/auto-review.json src/data/review-queue.json src/data/review-notification-state.json src/data/review-decisions.json src/data/new-history.json src/data/collection-health.json; then
            echo "No product changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json src/data/coffee-products-auto.json src/data/brand-collection-status.json src/data/coffee-collection-status.json src/data/convenience-collection-status.json src/data/foodservice-collection-status.json src/data/press-collection-status.json src/data/cu-collection-status.json src/data/icecream-collection-status.json src/data/auto-review.json src/data/review-queue.json src/data/review-notification-state.json src/data/review-decisions.json src/data/new-history.json src/data/collection-health.json
          git commit -m "chore: update official product data"
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
