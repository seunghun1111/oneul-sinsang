name: Update products

on:
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-products
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update:coffee
      - run: npm run update:products
      - run: npm test
      - run: npm run lint
      - run: env GITHUB_ACTIONS=true npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Commit updated product data
        run: |
          if git diff --quiet -- src/data/products.json src/data/coffee-products-auto.json; then
            echo "No product changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json src/data/coffee-products-auto.json
          git commit -m "chore: update official product data"
          git push

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
